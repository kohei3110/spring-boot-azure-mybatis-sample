<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do App</title>
    <style>
        body { font-family: "Segoe UI", Arial, sans-serif; margin: 40px; background: #f6f8fb; }
        h1 { color: #1a1a1a; }
        .container { max-width: 720px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        form { display: flex; gap: 8px; margin-bottom: 16px; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #d0d7de; }
        button { padding: 10px 14px; border: none; border-radius: 8px; background: #0969da; color: #fff; cursor: pointer; }
        button.secondary { background: #6e7781; }
        ul { list-style: none; padding: 0; }
        li { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eaeef2; }
        .title { flex: 1; }
        .done { text-decoration: line-through; color: #6e7781; }
        .badge { font-size: 12px; padding: 4px 8px; border-radius: 999px; background: #eaeef2; margin-right: 8px; }
        .message { color: #0969da; margin-bottom: 8px; }
        .actions { display: flex; gap: 8px; }
    </style>
</head>
<body>
<div class="container">
    <h1>To Do</h1>
    <p class="message" th:if="${message}" th:text="${message}"></p>

    <form method="post" action="/todos">
        <input type="text" name="title" placeholder="新しい To Do" required />
        <button type="submit">追加</button>
    </form>

    <ul>
        <li th:each="todo : ${todos}">
            <div class="title">
                <span class="badge" th:text="${todo.id}"></span>
                <span th:text="${todo.title}" th:classappend="${todo.completed} ? 'done' : ''"></span>
            </div>
            <div class="actions">
                <form th:action="@{/todos/{id}/toggle(id=${todo.id})}" method="post">
                    <button type="submit" class="secondary" th:text="${todo.completed} ? '未完了に戻す' : '完了にする'"></button>
                </form>
                <form th:action="@{/todos/{id}/delete(id=${todo.id})}" method="post">
                    <button type="submit">削除</button>
                </form>
            </div>
        </li>
    </ul>
</div>
</body>
</html>
